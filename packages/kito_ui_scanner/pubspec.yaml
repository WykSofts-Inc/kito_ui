name: kito_ui_scanner
description: QR and barcode scanning for Flutter on mobile_scanner — an animated viewfinder, torch and camera controls, a smart result sheet and payload parsing. Opt-in native kit.
version: 0.1.0
homepage: https://github.com/WykSofts-Inc/kito_ui
repository: https://github.com/WykSofts-Inc/kito_ui/tree/main/packages/kito_ui_scanner
issue_tracker: https://github.com/WykSofts-Inc/kito_ui/issues
topics: [ui, scanner, qr-code, barcode, camera]

# mobile_scanner 7 needs Dart 3.7 / Flutter 3.29.
environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  kito_ui_core: ^0.1.0
  mobile_scanner: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
