name: kito_devkit
description: "The Kito UI showcase: every kit, live."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  kito_ui_buttons: ^0.1.0
  kito_ui_calendar: ^0.1.0
  kito_ui_carousel: ^0.1.0
  kito_ui_charts: ^0.1.0
  kito_ui_chat: ^0.1.0
  kito_ui_checkout: ^0.1.0
  kito_ui_core: ^0.1.0
  kito_ui_empty_states: ^0.1.0
  kito_ui_fields: ^0.1.0
  kito_ui_formatting: ^0.1.0
  kito_ui_haptics: ^0.1.0
  kito_ui_loaders: ^0.1.0
  kito_ui_maps: ^0.1.0
  kito_ui_modals: ^0.1.0
  kito_ui_navigation: ^0.1.0
  kito_ui_onboarding: ^0.1.0
  kito_ui_scanner: ^0.1.0
  kito_ui_toasts: ^0.1.0
  kito_ui_validation: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
